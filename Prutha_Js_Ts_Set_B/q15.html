<body>
    <h3>Daily Orders</h3>
    <button type="button" id="b1">Increment</button><br><br>
    <button type="button" id="b2">Decrement</button><br><br>
    <button type="reset" id="b3">Reset</button><br>
    <script>
        let count = 0 ;
        function inc() {
            b1.inc() =+ count++
        }
        function dec() {
            b2.dec() =- count--
        }
        function reset() {
            b3.reset() == count
        }
    </script>
</body>
